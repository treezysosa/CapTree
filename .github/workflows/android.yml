name: Build Android APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retro-studio-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse development signing key when cached
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: retro-development-signing-v1
      - run: chmod +x gradlew
      - run: python3 -m unittest discover -s tools/tests -v
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Verify actual APK permissions, native alignment and signatures
        run: bash tools/verify_apks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro-ai-studio-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            apk-verification/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: retro-ai-studio-release-unsigned
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            apk-verification/
          retention-days: 14
      - name: Validate release signing with a disposable CI key
        run: bash tools/validate_release_signing.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-signing-verification
          path: signing-validation/
          retention-days: 14
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-test.txt
      - run: python -m pytest backend/tests -q
  device:
    # connectedDebugAndroidTest builds its APKs, so device checks can run independently.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: bash tools/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-verification-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-screenshots/
          retention-days: 14
