name: Validate offline speech model
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-speech-validation.yml'
      - 'tools/validate_offline_speech.py'
      - 'app/src/main/java/studio/retro/ai/media/OfflineSpeech.kt'
      - 'app/src/main/java/studio/retro/ai/media/SpeechModelStore.kt'
      - 'app/src/main/java/studio/retro/ai/media/SpeechPcm.kt'
      - 'app/src/androidTest/java/studio/retro/ai/PretrainedSpeechTest.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-speech-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install vosk==0.3.45
      - run: python tools/validate_offline_speech.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-offline-speech-fixtures
          path: |
            model-validation/offline-speech/speech-model.zip
            model-validation/offline-speech/speech.wav
            model-validation/offline-speech/speech.mp4
            model-validation/offline-speech/report.json
          retention-days: 14
  android-speech:
    needs: cpu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: real-offline-speech-fixtures
          path: app/src/androidTest/assets/speech-validation
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: bash tools/run_offline_speech_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-offline-speech-android-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            offline-speech-device/
          retention-days: 14
