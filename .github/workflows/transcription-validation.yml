name: Validate pretrained speech model
on:
  push:
    branches: [main]
    paths:
      - 'backend/app/transcription.py'
      - 'tools/validate_transcription_model.py'
      - '.github/workflows/transcription-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speech-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y espeak-ng
      - run: pip install -r backend/requirements-test.txt faster-whisper==1.1.1
      - run: python tools/validate_transcription_model.py
        env:
          PYTHONPATH: .
          HF_HUB_DISABLE_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-whisper-transcription-validation
          path: model-validation/transcription/
          retention-days: 14
